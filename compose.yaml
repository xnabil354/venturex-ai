services:
  app:
    image: venturex-ai:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      # Keep Auth.js redirects on the public origin behind the Nginx proxy.
      AUTH_URL: ${APP_URL:?Set APP_URL in .env.production}
      APP_URL: ${APP_URL:?Set APP_URL in .env.production}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      ADMIN_BOOTSTRAP_PASSWORD: ""
      # localhost in .env.production would refer to this container, not the VPS.
      # Use host Nginx TLS even when no extra Compose file is supplied.
      NINEROUTER_BASE_URL: ${NINEROUTER_CONTAINER_BASE_URL:-https://venturex.web.id/v1}
      NINEROUTER_LOOPBACK_TUNNEL_CONFIRMED: "false"
    extra_hosts:
      - "venturex.web.id:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    stop_grace_period: 30s

  migrate:
    image: venturex-ai:local
    build:
      context: .
      dockerfile: Dockerfile
    profiles: [ops]
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    command:
      - node
      - --experimental-strip-types
      - scripts/db.mjs
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed-reference:
    image: venturex-ai:local
    build:
      context: .
      dockerfile: Dockerfile
    profiles: [ops]
    env_file:
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    command: [node, scripts/reference-seed.mjs]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - venturex_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  venturex_postgres_data:

# Must match the private /v1/ allow rule in deploy/nginx/venturex.web.id.conf.
networks:
  default:
    ipam:
      config:
        - subnet: 172.21.0.0/16
